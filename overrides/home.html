{% extends "main.html" %}

<!-- Landing page: a VS Code-style hero injected above the normal content. -->
{% block tabs %}
  {{ super() }}
  <section class="ki-hero">
    <div class="ki-hero__inner md-grid">
      <img class="ki-hero__logo" src="{{ 'assets/mark.svg' | url }}" alt="Kube Inspector" />
      <h1 class="ki-hero__title">Kubernetes, in one window.</h1>
      <p class="ki-hero__tagline">{{ config.site_description }}</p>
      <div class="ki-hero__shots">
        <figure class="ki-hero__shot ki-reveal">
          <div class="ki-frame">
            <span class="ki-frame__dots"></span>
            <img src="{{ 'assets/screenshots/monitoring.png' | url }}" alt="Kube Inspector desktop app — live resource monitoring" loading="eager" />
          </div>
          <figcaption class="ki-hero__shot-label">Desktop app</figcaption>
        </figure>
        <figure class="ki-hero__shot ki-reveal">
          <div class="ki-frame">
            <span class="ki-frame__dots"></span>
            <img src="{{ 'assets/screenshots/cli-pods.png' | url }}" alt="Kube Inspector CLI — pods" loading="eager" />
          </div>
          <figcaption class="ki-hero__shot-label">CLI</figcaption>
        </figure>
      </div>
      <div class="ki-hero__cta">
        <a href="{{ 'downloads/' | url }}" class="md-button md-button--primary">
          Download
        </a>
      </div>
    </div>
  </section>
{% endblock %}

{% block content %}
  {{ super() }}
{% endblock %}
