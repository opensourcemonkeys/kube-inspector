apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toolbox.fullname" . }}
  labels:
    {{- include "toolbox.labels" . | nindent 4 }}
type: Opaque
data:
  api-token: {{ include "toolbox.persistentSecret" (dict "ctx" . "key" "api-token" "value" .Values.apiToken) | b64enc | quote }}
  audit-token: {{ include "toolbox.persistentSecret" (dict "ctx" . "key" "audit-token" "value" .Values.auditToken) | b64enc | quote }}
  {{- if .Values.clickhouse.enabled }}
  clickhouse-password: {{ include "toolbox.persistentSecret" (dict "ctx" . "key" "clickhouse-password" "value" .Values.clickhouse.password) | b64enc | quote }}
  {{- end }}
