apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toolbox.fullname" . }}
  labels:
    {{- include "toolbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "toolbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "toolbox.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Tokens reach the pod as env vars, which only change on restart.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "toolbox.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toolbox
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/toolbox/config.yaml"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: TOOLBOX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "toolbox.fullname" . }}
                  key: api-token
            - name: TOOLBOX_AUDIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "toolbox.fullname" . }}
                  key: audit-token
            {{- if .Values.clickhouse.enabled }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "toolbox.fullname" . }}
                  key: clickhouse-password
            {{- else if .Values.externalClickhouse.existingSecret }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalClickhouse.existingSecret }}
                  key: {{ .Values.externalClickhouse.passwordKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: webhook
              containerPort: 9443
          # Nothing listens until ClickHouse answers, and a fresh ClickHouse
          # (image pull, first start) can take minutes; without this the
          # liveness probe kills the pod while it is still waiting.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/toolbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "toolbox.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
