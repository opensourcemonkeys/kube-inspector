<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toolbox · change history</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">toolbox <span class="muted">change history</span></div>
    <div class="cluster" id="cluster"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="changes" aria-selected="true">Changes</button>
      <button role="tab" data-tab="attempts" aria-selected="false">Rejected</button>
      <button role="tab" data-tab="users" aria-selected="false">Users</button>
    </nav>
  </header>

  <form class="filters" id="filters" autocomplete="off">
    <label>Search <input name="q" placeholder="name, namespace, user, kind"></label>
    <label>Namespace <input name="namespace"></label>
    <label>Resource <input name="resource" placeholder="deployments"></label>
    <label>Name <input name="name"></label>
    <label>User <input name="user"></label>
    <label>Verb
      <select name="verb">
        <option value="">any</option>
        <option>create</option><option>update</option><option>delete</option><option>finalized</option>
      </select>
    </label>
    <label>Since
      <select name="since">
        <option value="1h">1 hour</option>
        <option value="24h" selected>24 hours</option>
        <option value="168h">7 days</option>
        <option value="720h">30 days</option>
        <option value="">all</option>
      </select>
    </label>
  </form>

  <main class="layout">
    <section class="list" id="list" aria-live="polite"></section>
    <aside class="detail" id="detail" hidden></aside>
  </main>

  <dialog id="token-dialog">
    <form method="dialog" class="token-form">
      <h2>API token</h2>
      <p class="muted">This API needs the token from the <code>toolbox-api</code> Secret.</p>
      <input id="token-input" type="password" required autocomplete="off">
      <div class="actions"><button value="ok" class="primary">Continue</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
