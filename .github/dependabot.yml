# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem so routine churn does not arrive as a dozen separate reviews; major
# bumps stay separate, because those are the ones that need reading.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(go)"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
    # Not routine bumps: licence changes. PrimeTek released PrimeReact 11 and
    # primeicons 8 (2026-07-15) under the commercial "PrimeUI" licence — a
    # licence key, revenue and headcount eligibility, no redistribution — which
    # cannot ship inside this GPL-3.0 app. PrimeReact 10.x stays MIT and still
    # gets patches, so only the major is ignored. primeicons is not a dependency
    # any more (the app never used its classes); the rule keeps it from coming
    # back the way 8.0.2 did. scripts/notices/ fails CI on it as well.
    ignore:
      - dependency-name: "primereact"
        versions: [">=11"]
      - dependency-name: "primeicons"
        versions: [">=8"]
    commit-message:
      prefix: "deps(frontend)"

  # The Electron shell is a separate npm project: electron and electron-builder
  # live here, and they set what the shipped packages are built from.
  - package-ecosystem: npm
    directory: "/electron"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      electron-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(electron)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(ci)"
