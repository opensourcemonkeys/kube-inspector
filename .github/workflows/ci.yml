name: CI

# Deliberately separate from build.yml, which only fires on tags. Until this
# workflow existed nothing was checked before a release: a type error or a
# failing test was first discovered at tag time, with the release already
# half-published. These jobs gate the code; build.yml ships it.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A force-push or a quick follow-up commit supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  # The Trivy security-scanner library pulls in encoding/json/v2, which is gated
  # behind the jsonv2 GOEXPERIMENT on Go 1.26. Without this every Go command in
  # this workflow fails with "build constraints exclude all Go files".
  GOEXPERIMENT: jsonv2

jobs:
  go:
    name: Go (build, vet, lint, test)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # cgo headers for the Wails shell. Only the dev/debug build links against
      # webkit, but `go build ./...` still compiles that package.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build
        run: go build ./...

      # The standalone CLI must stay Wails-free so its package carries no
      # webkit dependency — assert that, then prove it still builds.
      - name: Build CLI (must stay Wails-free)
        run: |
          if grep -rn "wailsapp/wails" internal/tui cmd/tui; then
            echo "::error::internal/tui and cmd/tui must not import Wails"
            exit 1
          fi
          go build -tags tui ./cmd/tui

      - name: Vet
        run: go vet ./...

      # Installed from the module proxy at a pinned version rather than via a
      # third-party action or a curl|sh installer: the checksum database
      # verifies it, and the version cannot drift under us.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # frontend/wailsjs is generated and gitignored, and every component
      # imports from it — tsc cannot run until it exists.
      - name: Generate bindings
        run: make bindings

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Typecheck
        run: cd frontend && npm run typecheck

      - name: Lint
        run: cd frontend && npm run lint

      # The five translated locale catalogs are plain JSON — neither tsc nor
      # ESLint can see a key that drifted away from `en`, a dropped {{count}}
      # or a Russian plural form that was never written.
      - name: i18n catalog parity
        run: cd frontend && npm run i18n:check

      - name: Test
        run: cd frontend && npm run test

      - name: Build
        run: cd frontend && npm run build

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # docs-downloads derives the version from `git describe --tags`.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install "mkdocs-material[imaging]"

      # --strict turns a broken internal link or a page missing from the nav
      # into a failure, which is the only automated check the docs have.
      - name: Build docs
        run: make docs-build

      - name: Assert the build left no tracked file modified
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::make docs-build dirtied the working tree:"
            git status --porcelain
            exit 1
          fi
