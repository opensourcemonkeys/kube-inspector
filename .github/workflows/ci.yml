name: CI

# Deliberately separate from build.yml, which only fires on tags. Until this
# workflow existed nothing was checked before a release: a type error or a
# failing test was first discovered at tag time, with the release already
# half-published. These jobs gate the code; build.yml ships it.
#
# CI runs on working branches, not on main: work is verified on its branch
# before it lands, and main only receives finished work and release commits.
on:
  push:
    # Every branch except main. A run there was cancelled by hand on every
    # release push, which is what the README badge kept reporting as a failure.
    # Tags are not matched: with only a branch filter, a tag push does not
    # trigger this workflow (build.yml owns tags).
    branches-ignore:
      - main
  # Kept for pull requests from forks only — see each job's `if`. A branch of
  # this repository is already covered by its push run; running both would
  # double every check.
  pull_request:
  workflow_dispatch:
  # The release gate. build.yml calls this workflow first and every build job
  # `needs:` it, so a tag can never package code these checks have not passed —
  # work lands on main, where the push trigger above deliberately does not run.
  # Called, not copied, so the gate and the branch checks cannot drift apart.
  workflow_call:

# A force-push or a quick follow-up commit supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  # The Trivy security-scanner library pulls in encoding/json/v2, which is gated
  # behind the jsonv2 GOEXPERIMENT on Go 1.26 (on by default since 1.27, which
  # go.mod requires). Without it a 1.26 toolchain fails every Go command with
  # "build constraints exclude all Go files".
  GOEXPERIMENT: jsonv2

jobs:
  go:
    name: Go (build, vet, lint, test)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'

      # cgo headers for the Wails shell. Only the dev/debug build links against
      # webkit, but `go build ./...` still compiles that package.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build
        run: go build ./...

      # The standalone CLI must stay Wails-free so its package carries no
      # webkit dependency — assert that, then prove it still builds.
      - name: Build CLI (must stay Wails-free)
        run: |
          if grep -rn "wailsapp/wails" internal/tui cmd/tui; then
            echo "::error::internal/tui and cmd/tui must not import Wails"
            exit 1
          fi
          go build -tags tui ./cmd/tui

      - name: Vet
        run: go vet ./...

      # Installed from the module proxy at a pinned version rather than via a
      # third-party action or a curl|sh installer: the checksum database
      # verifies it, and the version cannot drift under us.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        run: go test ./...

      # Pinned from the module proxy, like golangci-lint above. govulncheck has
      # no way to accept a finding, so the script does: it fails on a reachable
      # vulnerability not reviewed in scripts/vulncheck/accepted.txt (the Ollama
      # module's server-side advisories are; see .github/SECURITY.md). The
      # runner's preinstalled Node runs it; it needs nothing from npm.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Vulnerabilities (govulncheck)
        run: node scripts/vulncheck/vulncheck.mjs

  frontend:
    name: Frontend (typecheck, lint, test, build)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      # frontend/wailsjs is generated and gitignored, and every component
      # imports from it — tsc cannot run until it exists.
      - name: Generate bindings
        run: make bindings

      - name: Install dependencies
        run: cd frontend && npm ci

      # Every Go module in either binary and every production npm package must
      # be under a licence compatible with GPL-3.0, and recognised. This is the
      # gate that would have caught primeicons 8 (a commercial licence that
      # arrived as a dependabot bump). The electron shell's node_modules are
      # not installed here; its lockfile's declared licence is used instead.
      - name: Third-party licences (GPL-3.0 compatible)
        run: node scripts/notices/notices.mjs --check

      - name: Typecheck
        run: cd frontend && npm run typecheck

      - name: Lint
        run: cd frontend && npm run lint

      # The five translated locale catalogs are plain JSON — neither tsc nor
      # ESLint can see a key that drifted away from `en`, a dropped {{count}}
      # or a Russian plural form that was never written.
      - name: i18n catalog parity
        run: cd frontend && npm run i18n:check

      - name: Test
        run: cd frontend && npm run test

      # The Electron shell's pure modules (crash recovery). node:test only — no
      # npm install, no Electron, no display.
      - name: Electron shell tests
        run: cd electron && npm test

      - name: Build
        run: cd frontend && npm run build

  docs:
    name: Docs (mkdocs --strict)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # docs-downloads derives the version from `git describe --tags`.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install "mkdocs-material[imaging]"

      # --strict turns a broken internal link or a page missing from the nav
      # into a failure, which is the only automated check the docs have.
      - name: Build docs
        run: make docs-build

      - name: Assert the build left no tracked file modified
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::make docs-build dirtied the working tree:"
            git status --porcelain
            exit 1
          fi
