name: Build & Release

on:
  push:
    tags:
      # Release tags only. An unfiltered '*' meant any tag — including a
      # throwaway or a backup marker — triggered a three-platform build, an R2
      # upload to the public bucket, a GitHub Release and a docs deploy.
      - 'v*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  # The Trivy security-scanner library pulls in encoding/json/v2, which is
  # gated behind the jsonv2 GOEXPERIMENT on Go 1.26.
  GOEXPERIMENT: jsonv2

# The R2 credentials are declared per job rather than here. They are write
# credentials for the public bucket, and `release` — which only reads
# CHANGELOG.md — has no business holding them.

jobs:
  # ==========================================
  # STAGE 1: BUILD & PACKAGE (DIRECT TO R2)
  # ==========================================

  build-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-22.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          # Full history with tags: `make print-version` runs
          # `git describe --tags`, and the stable-channel manifest scans every
          # tag. A shallow checkout yields an empty version that flows silently
          # into LDFLAGS, the package name and the update manifest.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Resolve release version
        # The single source of truth. Every later step uses ${VERSION} from the
        # environment; nothing re-derives it. `make pkg-*` computes its own
        # VERSION from the same `git describe`, so asserting that it equals the
        # tag transitively guarantees the package name, the injected appVersion,
        # the artifact filename and the update manifest all carry one string.
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make -s print-version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::make print-version produced an empty version - no tag is reachable from HEAD (is fetch-depth: 0 set on this checkout?)"
            exit 1
          fi
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: the Makefile derives '$VERSION' from git describe, but the tag is '$TAG_VERSION'. The artifacts and the manifest would disagree."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        # Pinned to the version in go.mod. Every `uses:` here is SHA-pinned;
        # an unpinned @latest toolchain generates the bindings a release is
        # built from, which is the loudest remaining supply-chain gap.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build and Package
        run: make pkg-linux

      # Electron bundles its own Chromium, so a single build works on every
      # distro — no per-distro variants, no webkit2gtk version split.
      - name: Rename Packages with Platform
        run: |
          set -euo pipefail
          mv "dist/kube-inspector_${VERSION}_amd64.deb"    "dist/kube-inspector-${VERSION}-linux-amd64.deb"
          mv "dist/kube-inspector-${VERSION}-1.x86_64.rpm" "dist/kube-inspector-${VERSION}-linux-x86_64.rpm"

      - name: Build & Package CLI (kube-inspector-cli)
        run: |
          set -euo pipefail
          make build-tui-linux
          make pkg-tui-deb
          make pkg-tui-rpm
          mkdir -p dist
          tar -czf "dist/kube-inspector-cli-${VERSION}-linux-amd64.tar.gz" -C build/bin kube-inspector-cli
          # -linux-, not -debian-: the desktop deb is already -linux-amd64.deb and
          # two conventions in one dist/ is how a docs link ends up pointing at
          # a name nothing produces.
          mv "dist/kube-inspector-cli_${VERSION}_amd64.deb"    "dist/kube-inspector-cli-${VERSION}-linux-amd64.deb"
          mv "dist/kube-inspector-cli-${VERSION}-1.x86_64.rpm" "dist/kube-inspector-cli-${VERSION}-linux-x86_64.rpm"

      # A .sha256 sidecar per artifact. The in-app updater fetches
      # <assetUrl>.sha256 and refuses to install a package that does not match,
      # because on Linux it hands the file to dpkg/rpm as root.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload to Cloudflare R2
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync dist/ "s3://${R2_BUCKET}/dist/" --endpoint-url "$ENDPOINT" --no-progress

  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          # Full history with tags: `make print-version` runs
          # `git describe --tags`, and the stable-channel manifest scans every
          # tag. A shallow checkout yields an empty version that flows silently
          # into LDFLAGS, the package name and the update manifest.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Resolve release version
        # The single source of truth. Every later step uses ${VERSION} from the
        # environment; nothing re-derives it. `make pkg-*` computes its own
        # VERSION from the same `git describe`, so asserting that it equals the
        # tag transitively guarantees the package name, the injected appVersion,
        # the artifact filename and the update manifest all carry one string.
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make -s print-version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::make print-version produced an empty version - no tag is reachable from HEAD (is fetch-depth: 0 set on this checkout?)"
            exit 1
          fi
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: the Makefile derives '$VERSION' from git describe, but the tag is '$TAG_VERSION'. The artifacts and the manifest would disagree."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install NSIS
        run: |
          winget install NSIS.NSIS --silent --accept-source-agreements
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Wails CLI
        # Pinned to the version in go.mod. Every `uses:` here is SHA-pinned;
        # an unpinned @latest toolchain generates the bindings a release is
        # built from, which is the loudest remaining supply-chain gap.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build and Package
        shell: bash
        run: make pkg-windows

      - name: Rename Installer with Version
        shell: bash
        run: |
          set -euo pipefail
          mv "dist/kube-inspector-${VERSION}-x64.exe" "dist/kube-inspector-${VERSION}-windows-amd64.exe"

      - name: Build CLI (kube-inspector-cli)
        shell: bash
        run: |
          set -euo pipefail
          make build-tui-windows
          mkdir -p dist
          # Into dist/, not build/bin/: the Checksums step does `cd dist` and the
          # R2 sync only uploads dist/, so renaming in place published nothing
          # while docs/downloads.md.in advertised the URL.
          mv build/bin/kube-inspector-cli.exe "dist/kube-inspector-cli-${VERSION}-windows-amd64.exe"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload to Cloudflare R2
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync dist/ "s3://${R2_BUCKET}/dist/" --endpoint-url "$ENDPOINT" --no-progress

  build-macos:
    name: Build & Package (macOS)
    runs-on: macos-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          # Full history with tags: `make print-version` runs
          # `git describe --tags`, and the stable-channel manifest scans every
          # tag. A shallow checkout yields an empty version that flows silently
          # into LDFLAGS, the package name and the update manifest.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Resolve release version
        # The single source of truth. Every later step uses ${VERSION} from the
        # environment; nothing re-derives it. `make pkg-*` computes its own
        # VERSION from the same `git describe`, so asserting that it equals the
        # tag transitively guarantees the package name, the injected appVersion,
        # the artifact filename and the update manifest all carry one string.
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make -s print-version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::make print-version produced an empty version - no tag is reachable from HEAD (is fetch-depth: 0 set on this checkout?)"
            exit 1
          fi
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: the Makefile derives '$VERSION' from git describe, but the tag is '$TAG_VERSION'. The artifacts and the manifest would disagree."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        # Pinned to the version in go.mod. Every `uses:` here is SHA-pinned;
        # an unpinned @latest toolchain generates the bindings a release is
        # built from, which is the loudest remaining supply-chain gap.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build and Package
        run: make pkg-mac

      - name: Rename Installer with Version
        run: |
          set -euo pipefail
          mv "dist/kube-inspector-${VERSION}-arm64.dmg" "dist/kube-inspector-${VERSION}-macos-arm64.dmg"

      - name: Build CLI (kube-inspector-cli)
        run: |
          set -euo pipefail
          make build-tui-mac
          mkdir -p dist
          tar -czf "dist/kube-inspector-cli-${VERSION}-macos-universal.tar.gz" -C build/bin kube-inspector-cli

      # macOS has no sha256sum; shasum -a 256 emits the same "<hash>  <name>".
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue;; esac
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload to Cloudflare R2
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync dist/ "s3://${R2_BUCKET}/dist/" --endpoint-url "$ENDPOINT" --no-progress

  # ==========================================
  # STAGE 2b: PUBLISH SHA256SUMS
  # ==========================================
  # A checksum served from the same host as the artifact only proves the file
  # arrived intact — against a compromised host it proves nothing. Publishing the
  # same SHA256SUMS to the GitHub Release as well gives it a second origin, with
  # different credentials and a different operator, and that cross-check is the
  # strongest integrity story this project can offer without code-signing
  # certificates (see docs/getting-started/verifying-downloads.md).
  #
  # It has to be its own job: each build job produces a disjoint slice of the
  # artifacts, so none of them can see them all.
  checksums:
    name: Publish SHA256SUMS
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: github.ref_type == 'tag'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make -s print-version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::make print-version produced an empty version - no tag is reachable from HEAD (is fetch-depth: 0 set on this checkout?)"
            exit 1
          fi
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: the Makefile derives '$VERSION' from git describe, but the tag is '$TAG_VERSION'. The artifacts and the manifest would disagree."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Collect and publish SHA256SUMS
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p sums

          # Only this release's sidecars. dist/ accumulates every version ever
          # shipped, on purpose: the artifact sync has no --delete, so a link
          # published in an old changelog keeps working.
          aws s3 cp "s3://${R2_BUCKET}/dist/" sums/ \
            --endpoint-url "$ENDPOINT" --recursive --no-progress \
            --exclude "*" --include "*${VERSION}*.sha256"

          cd sums
          count=$(ls -1 ./*.sha256 2>/dev/null | wc -l)
          if [ "$count" -lt 7 ]; then
            echo "::error::expected at least 7 checksum sidecars for ${VERSION}, found ${count} - a build job silently published nothing"
            ls -la
            exit 1
          fi

          # sha256sum (Linux/Windows) and shasum -a 256 (macOS) both emit
          # "<hash>  <name>", so concatenating them yields a file that
          # `sha256sum -c` accepts verbatim.
          #
          # The per-file .sha256 sidecars STAY. The in-app updater fetches
          # <assetUrl>.sha256 and refuses to install without it, so consolidating
          # them away here would silently disable every in-app update.
          cat $(ls -1 ./*.sha256 | sort) > SHA256SUMS
          cat SHA256SUMS

          # Two objects by design: the versioned one is immutable and is what the
          # docs link to; the bare one always names the newest release.
          aws s3 cp SHA256SUMS "s3://${R2_BUCKET}/dist/SHA256SUMS-${VERSION}" \
            --endpoint-url "$ENDPOINT" --no-progress
          aws s3 cp SHA256SUMS "s3://${R2_BUCKET}/dist/SHA256SUMS" \
            --endpoint-url "$ENDPOINT" --no-progress

      - name: Upload SHA256SUMS as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sha256sums
          path: sums/SHA256SUMS

  # ==========================================
  # STAGE 2: RELEASE (SOURCE CODE ONLY)
  # ==========================================

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [checksums]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download SHA256SUMS
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sha256sums

      - name: Extract Release Notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: github.ref_type == 'tag'
        with:
          body_path: /tmp/release_notes.md
          # The binaries themselves live on R2 — only SHA256SUMS is attached
          # here, and deliberately so: a checksum file is worth little served
          # from the same host as the artifacts it describes. This copy is the
          # independent origin users can check the R2 copy against.
          files: SHA256SUMS

  # ==========================================
  # STAGE 2c: BUILD & PUBLISH DOCS WEBSITE
  # ==========================================
  deploy-docs:
    name: Build & deploy docs to R2
    runs-on: ubuntu-latest
    # Through checksums rather than straight off the builds: this job publishes
    # the update manifests, and the step below refuses to publish one whose
    # assets are not reachable — which includes their .sha256 sidecars.
    needs: [checksums]
    if: github.ref_type == 'tag'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Three separate reasons, and this job had none of them: docs-downloads
          # runs `git describe`, the stable-channel manifest scans every tag, and
          # mkdocs_hooks.py falls back to `git describe` for the header chip.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.12'

      - name: Install image libraries (Cairo/Pango) for social cards
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev \
            libjpeg-dev libpng-dev libz-dev libpango1.0-dev

      - name: Install MkDocs Material
        run: pip install "mkdocs-material[imaging]"

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(make -s print-version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::make print-version produced an empty version - no tag is reachable from HEAD (is fetch-depth: 0 set on this checkout?)"
            exit 1
          fi
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: the Makefile derives '$VERSION' from git describe, but the tag is '$TAG_VERSION'. The artifacts and the manifest would disagree."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build site
        run: make docs-build

      # This job is what publishes the manifests (mkdocs copies docs/*.json into
      # site/, and the sync below puts them at the bucket root). If a URL in one
      # of them 404s, the only place that surfaces is a user's failed in-app
      # update — so fail here instead, and leave the previous release's manifest
      # in place, still pointing at assets that exist.
      - name: Verify every URL in the generated manifests
        run: |
          set -euo pipefail
          # `.assets[]?` with the ? is deliberate: it yields nothing rather than
          # erroring on the empty-assets shape a channel with no release yet has.
          urls="$(jq -r '.assets[]?, (.assets[]? + ".sha256")' \
                    docs/version.json docs/version-beta.json | sort -u)"
          if [ -z "$urls" ]; then
            echo "::error::the generated manifests contain no asset URLs at all"
            exit 1
          fi

          fail=0
          for u in $urls; do
            ok=0
            # Cloudflare caches a 404 in front of R2 for a few minutes, so a
            # probe that lost the race with the upload would poison the check.
            # no-cache forces revalidation; the retries cover propagation.
            for attempt in 1 2 3; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' -I \
                        -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                        "$u" || echo 000)"
              [ "$code" = "200" ] && { ok=1; break; }
              echo "  $u -> $code (attempt $attempt/3)"
              sleep 20
            done
            if [ "$ok" = 1 ]; then
              echo "200 $u"
            else
              echo "::error::release asset is not reachable: $u"
              fail=1
            fi
          done
          [ "$fail" = 0 ]

      - name: Publish site to Cloudflare R2
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Publishing site/ to s3://${R2_BUCKET}/ (preserving dist/*) ..."
          aws s3 sync site/ "s3://${R2_BUCKET}/" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --exclude "dist/*" \
            --exclude "dcount.json" \
            --exclude "vcount.json" \
            --no-progress
