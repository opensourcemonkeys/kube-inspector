site_name: Kube Inspector
site_description: A visual desktop client for managing Kubernetes clusters
site_author: Kube Inspector contributors
site_url: https://kubeinspector.com

# Open-source repository — rendered as the GitHub link in the header (top right)
# and inside the drawer on small screens. Material also fetches the star/fork
# counts from the GitHub API and shows them under the repo name.
repo_url: https://github.com/opensourcemonkeys/kube-inspector
repo_name: kube-inspector
# No "edit this page" links (content.action.edit is not enabled), so keep the
# default edit_uri from pointing at a branch that doesn't exist.
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark only — matches the desktop app's "monolith" theme (no light toggle)
    scheme: slate
    primary: custom
    accent: custom

  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - toc.integrate
    
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.tabbed
    - content.code.superfences
    - content.code.highlight
    - content.code.inline

plugins:
  # Adding a `plugins:` block disables the implicit default search plugin, so it
  # must be listed explicitly.
  - search
  # Social/link-preview cards (og:image, twitter:image). Requires the imaging
  # extras (Cairo + Pango) — only enabled in CI (CI=true) so a local
  # `mkdocs serve` without those system libraries still works.
  - social:
      enabled: !ENV [CI, false]
      cards_layout_options:
        background_color: "#080b11"
        color: "#e7eaf0"
        font_family: Inter

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Getting Started:
    - Installation: getting-started/installation.md
    - Verifying Downloads: getting-started/verifying-downloads.md
    - Unsigned Builds: getting-started/unsigned-builds.md
    - Adding Clusters: getting-started/cluster-setup.md
  - Downloads: downloads.md
  - CLI:
    - Overview: cli/index.md
    - Installation: cli/installation.md
    - Usage & Shortcuts: cli/usage.md
  - Changelog: changelog.md
  - Docs:
    - Workloads:
      - Overview: workloads/index.md
      - Pods: workloads/pods.md
      - Deployments: workloads/deployments.md
      - StatefulSets & ReplicaSets: workloads/statefulsets-replicasets.md
      - DaemonSets: workloads/daemonsets.md
      - Jobs & CronJobs: workloads/jobs-cronjobs.md
    - Networking:
      - Services: networking/services.md
      - Ingresses: networking/ingresses.md
      - Ingress Classes: networking/ingress-classes.md
      - Endpoints: networking/endpoints.md
      - Network Policies: networking/network-policies.md
    - Config & Secrets:
      - ConfigMaps: config-secrets/configmaps.md
      - Secrets: config-secrets/secrets.md
    - Security:
      - Service Accounts: security/service-accounts.md
      - Roles: security/roles.md
      - Role Bindings: security/role-bindings.md
      - Security Role Map: security/security-role-map.md
      - Vulnerability Scan: security/vulnerability-scan.md
    - Storage:
      - Persistent Volumes: storage/persistent-volumes.md
      - Volume Claims: storage/volume-claims.md
      - Storage Classes: storage/storage-classes.md
    - Cluster:
      - Monitoring: cluster/monitoring.md
      - Nodes: cluster/nodes.md
      - Namespaces: cluster/namespaces.md
      - Events: cluster/events.md
      - Resource Quotas: cluster/resource-quotas.md
      - Limit Ranges: cluster/limit-ranges.md
    - Workspace:
      - YAML Editor: workspace/yaml-editor.md
      - Describe: workspace/describe.md
      - Terminal: workspace/terminal.md
      - Log Viewer: workspace/log-viewer.md
      - Port Forwarding: workspace/port-forwarding.md
      - Cluster Graph: workspace/cluster-graph.md
    - Settings:
      - Language: settings/language.md
  - Help:
    - FAQ: faq.md
    - Troubleshooting: troubleshooting.md
    - Known Limitations: known-limitations.md
    - Uninstall: uninstall.md
    - Support: support.md
    - Privacy: privacy.md
    - Translations: contributing/translations.md

extra_css:
  - stylesheets/extra.css

hooks:
  - mkdocs_hooks.py

extra_javascript:
  - javascripts/reveal.js
  - javascripts/changelog.js
  - javascripts/version-chip.js
  - javascripts/sponsor-chip.js

extra:
  # Sponsor link, shown as a pill beside the GitHub one in the header (and in
  # the drawer on small screens) by javascripts/sponsor-chip.js. Reaches the
  # page as a <meta> tag via overrides/main.html — change the URL here only.
  sponsor_url: https://github.com/sponsors/opensourcemonkeys
  sponsor_label: Sponsor
  analytics:
    provider: google
    property: G-707GCW6202