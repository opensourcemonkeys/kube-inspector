# The shipped GUI. The Wails shell is development-only and is not packaged.
appId: com.kubeinspector.app
productName: Kube Inspector

directories:
  # Build output, not release output: this holds linux-unpacked/ (~523MB of
  # intermediate app tree) which must never reach dist/. CI does
  # `aws s3 sync dist/` to the public bucket, so dist/ holds shippable packages
  # only. nfpm reads the tree from here and writes the packages into dist/.
  output: ../build/electron
  buildResources: ../build

# Only the shell scripts. The frontend bundle is embedded in the Go binary and
# served by it, so packaging it here again would just duplicate ~7MB.
#
# Every module main.cjs requires must be listed, or the packaged app dies at
# start-up on a missing require — nothing in a dev run would show it.
files:
  - main.cjs
  - preload.cjs
  - logfile.cjs
  - crashRecovery.cjs
  - package.json

# The Go binary IS the application. Built by `make build-sidecar` (or the
# cross-compile inside pkg-windows / pkg-mac) into build/bin/, and declared
# per-platform below because Windows needs the .exe name. Platform
# extraResources are *added* to a top-level list, not substituted for it, so a
# shared entry here would leave every Windows build warning about the missing
# unix-named binary.

compression: maximum

# productName contains a space, which would end up percent-encoded in the
# download URL. Match the naming of the nfpm packages instead.
artifactName: ${name}-${version}-${arch}.${ext}

linux:
  executableName: kube-inspector
  # deb/rpm are deliberately NOT built here: electron-builder shells out to
  # dpkg/fakeroot/rpmbuild, which do not exist on Fedora or any non-Debian dev
  # machine. `dir` produces linux-unpacked/, which build/nfpm.yaml then packages
  # with nfpm — the same pure-Go packager the CLI uses.
  # `dir` only: linux-unpacked/ is what nfpm packages. No AppImage.
  target: [dir]
  category: Development
  icon: ../build/appicon.png
  extraResources:
    - from: ../build/bin/kube-inspector
      to: kube-inspector

win:
  target: [nsis]
  # Explicit, because buildResources (../build) has no icon.ico at its root and
  # electron-builder's fallback is build/icons/ — which exists, but holds the
  # hicolor tree nfpm installs on Linux, not a flat icon set. Without this the
  # Windows/mac builds die in CollectIcons ("doesn't contain icons").
  icon: ../build/windows/icon.ico
  # pkg-windows cross-compiles to kube-inspector.exe, which is the name
  # main.cjs looks for under resourcesPath. Getting this wrong is only a
  # warning, so the installer would ship without its backend rather than fail.
  extraResources:
    - from: ../build/bin/kube-inspector.exe
      to: kube-inspector.exe

# Both are electron-builder defaults, but the in-app updater depends on them:
# it runs the installer with /S and quits without waiting, so NSIS itself has to
# close the old version and start the new one.
nsis:
  oneClick: true
  runAfterFinish: true

mac:
  # 512x512 source; electron-builder converts it to icns. Same reason as the
  # win icon above — there is no icon.icns in buildResources.
  icon: ../build/appicon.png
  # Deliberately NOT a universal build: the Go binary is ~262MB (Trivy), so a
  # universal dmg would embed two of them. Ship per-arch instead.
  target:
    - target: dmg
      arch: [arm64]
  extraResources:
    - from: ../build/bin/kube-inspector
      to: kube-inspector
