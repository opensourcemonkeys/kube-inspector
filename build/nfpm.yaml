# Linux packaging for the shipped GUI, which is the Electron shell.
#
# electron-builder *builds* (into build/electron); nfpm *packages* (into dist/).
# electron-builder's own deb/rpm targets shell out to dpkg/fakeroot/rpmbuild,
# which do not exist on Fedora or any non-Debian machine; nfpm is pure Go.
#
# The Wails shell is a development-only alternative and is no longer packaged.

# ==========================================
# 1. PACKAGE METADATA
# ==========================================
name: "kube-inspector"
version: "${VERSION}"
version_schema: none
arch: "amd64"
platform: "linux"
maintainer: "hakanyorulmaz"
description: "A visual desktop client for managing Kubernetes clusters."
homepage: "https://kubeinspector.com"
license: "GPL-3.0"
vendor: "hakanyorulmaz"

# ==========================================
# 2. PACKAGE CONTENTS
# ==========================================
contents:
  # The whole Electron app tree: the Electron runtime, our shell scripts in
  # app.asar, and resources/kube-inspector — the Go sidecar, which embeds and
  # serves the frontend and does all the Kubernetes work.
  - src: "./build/electron/linux-unpacked"
    dst: "/opt/kube-inspector"
    type: tree

  - src: "/opt/kube-inspector/kube-inspector"
    dst: "/usr/bin/kube-inspector"
    type: symlink

  - src: "./build/kube-inspector.desktop"
    dst: "/usr/share/applications/kube-inspector.desktop"
    file_info:
      mode: 0o644

  # Every size the freedesktop icon spec asks for, pre-scaled from appicon.png
  # and committed under build/icons. A `tree` rather than eight explicit entries
  # so adding a size needs no packaging change, and so nothing here depends on
  # ImageMagick being installed on the build host.
  #
  # This replaced a single 512x512 entry: nfpm rejects two entries for the same
  # destination path, so the two cannot coexist. At 512 alone, panels and window
  # title bars had to downscale on the fly and the launcher icon looked soft.
  - src: "./build/icons/hicolor"
    dst: "/usr/share/icons/hicolor"
    type: tree

# chrome-sandbox must end up setuid root or the app aborts at startup. It cannot
# be expressed in contents: nfpm rejects a second entry for a path the `tree`
# already supplied, and a non-root build user cannot assign root ownership.
scripts:
  postinstall: ./build/electron-postinstall.sh
  postremove: ./build/electron-postremove.sh

# ==========================================
# 3. RUNTIME DEPENDENCIES
# ==========================================
# Electron bundles Chromium, but not the system libraries Chromium links
# against. With no `depends` at all a minimal install or WSL got a package that
# installed fine and then died with "error while loading shared libraries:
# libnss3.so". libwebkit2gtk is still not among them — dropping it is the point
# of the Electron shell.
#
# The list is the binary's own NEEDED entries, not electron-builder's default
# (FpmTarget.getDefaultDepends), which predates Electron's libgbm/libasound/
# libcups links and lists libxss/libxtst/libuuid it no longer has. Re-derive it
# after an Electron major bump:
#
#   readelf -d build/electron/linux-unpacked/kube-inspector | grep NEEDED
#
# glibc and libgcc_s are left out (essential on every distro). The Go sidecar
# and the other ELF files in the tree (libffmpeg, swiftshader, crashpad,
# chrome-sandbox) need nothing beyond glibc.
#
# xdg-utils is a Recommends, not a Depends: it is not linked, only called at
# runtime (shell.openExternal and "open log folder" use xdg-open), so the app
# starts without it. It is also the one entry a machine already running this
# app may lack — every linked library is there by definition — and a Depends it
# lacked would make an in-app update's install fail. apt and dnf still install
# a Recommends by default on a fresh install.
#
# ADDING A Depends HERE (e.g. after an Electron bump links a new library) means
# existing users may not have it. The in-app updater goes through apt-get/dnf
# where they exist, which resolve it (selfUpdate_linux.go::installCommand); the
# dpkg -i fallback does not. Say so in the release notes.
overrides:
  # Package names, with the t64 name as an alternative: Ubuntu 24.04 and Debian
  # 13 renamed these in the 64-bit time_t transition. The t64 packages also
  # Provide the old names, so either spelling resolves; both are listed so it
  # does not hinge on that.
  deb:
    depends:
      - libasound2 | libasound2t64
      - libatk1.0-0 | libatk1.0-0t64
      - libatk-bridge2.0-0 | libatk-bridge2.0-0t64
      - libatspi2.0-0 | libatspi2.0-0t64
      - libcairo2
      - libcups2 | libcups2t64
      - libdbus-1-3
      - libexpat1
      - libgbm1
      - libglib2.0-0 | libglib2.0-0t64
      - libgtk-3-0 | libgtk-3-0t64
      - libnspr4
      - libnss3
      - libpango-1.0-0
      - libudev1
      - libx11-6
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxkbcommon0
      - libxrandr2
    recommends:
      - xdg-utils
  # Sonames rather than package names: every rpm distro auto-provides them, so
  # one list resolves on Fedora, RHEL and openSUSE even though they name the
  # packages differently (gtk3 vs libgtk-3-0, nss vs mozilla-nss, ...). This is
  # exactly what rpmbuild's own dependency generator would have emitted.
  rpm:
    depends:
      - libasound.so.2()(64bit)
      - libatk-1.0.so.0()(64bit)
      - libatk-bridge-2.0.so.0()(64bit)
      - libatspi.so.0()(64bit)
      - libcairo.so.2()(64bit)
      - libcups.so.2()(64bit)
      - libdbus-1.so.3()(64bit)
      - libexpat.so.1()(64bit)
      - libgbm.so.1()(64bit)
      - libgio-2.0.so.0()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libgobject-2.0.so.0()(64bit)
      - libgtk-3.so.0()(64bit)
      - libnspr4.so()(64bit)
      - libnss3.so()(64bit)
      - libnssutil3.so()(64bit)
      - libpango-1.0.so.0()(64bit)
      - libsmime3.so()(64bit)
      - libudev.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libxcb.so.1()(64bit)
      - libXcomposite.so.1()(64bit)
      - libXdamage.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libXrandr.so.2()(64bit)
    recommends:
      - xdg-utils

# kubectl is deliberately NOT a dependency. "Apply YAML" used to shell out to
# it, which silently did not work on a clean machine; it now runs server-side
# apply through client-go's dynamic client (internal/services/applyYamlServices.go).
# Do not reintroduce a subprocess here — the app talks to the API server itself.
